name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支的新 push 直接取消旧构建，省 CI 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_VERSION: 3.9.9
  JAVA_VERSION: '21'

jobs:
  # ============================================================
  # Job 1：编译 + 单元测试 + 集成测试 + 覆盖率门禁
  # ★ CI 零外部依赖：纯 JDK 21 + JFR，不调用任何外部服务、不产生费用。
  #   loomguard 的探针用进程内 jdk.VirtualThreadPinned 录制，无需特殊 JVM 参数。
  # ============================================================
  verify:
    # ★ 这里必须写死版本号，不能用 ${{ env.JAVA_VERSION }}。
    #   job 的 name 字段在 workflow 解析的极早期求值，此时 env 尚未填充，
    #   GitHub 会直接拒绝整个文件（见 ①②③ 的踩坑记录）。
    name: verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 打印工具链版本
        run: java -version && ./mvnw -version

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # 覆盖率门禁（core ≥ 75% / 其余 ≥ 60%）在 jacoco:check 里，低于阈值本步即失败。
      # 注意：本步使用完整 clean verify（不传 -Dtest=），所有测试都会真正运行，
      # 不会触发「-DfailIfNoTests=false 对 -Dtest= 无效」的假绿陷阱。
      - name: 编译 + 测试 + 覆盖率门禁
        run: ./mvnw -B -ntp clean verify -Dstyle.color=never

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/index.html'
          retention-days: 14

  # ============================================================
  # Job 2：格式检查（spotless 同时负责 Apache-2.0 许可证头）
  # ============================================================
  spotless:
    name: spotless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 检查代码格式与 Apache-2.0 许可证头（google-java-format AOSP）
        run: ./mvnw -B -ntp spotless:check -Dstyle.color=never

  # ============================================================
  # Job 3：架构边界门禁
  #   core 零 Spring 依赖 —— loomguard-core 必须保持纯 Java（仅靠 JDK 的 jdk.jfr）。
  # ============================================================
  architecture-boundaries:
    name: architecture-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: core 模块禁止出现 Spring 依赖
        # ★ 两条命令必须在同一个 run 块里：写成两个平级 run: 会被 YAML 静默覆盖，
        #   导致 dependency:list 没执行、清单文件从未生成，而「文件不存在」时 grep 返回非 0
        #   会让 if 走 else 分支打印「边界完好」—— 门禁假绿。先显式校验清单非空。
        run: |
          # ★ 必须先 install：core 现在依赖 loomguard-contract（compile）与 loomguard-mock-jfr（test），
          #   只跑 `-pl loomguard-core` 时这两个兄弟模块的 SNAPSHOT 在本地仓库里根本不存在，
          #   dependency:list 会以「Could not find artifact」直接失败 —— 那不是「边界完好」，
          #   是门禁压根没跑起来。这里装的是跳过测试的产物，只为让依赖能被解析。
          ./mvnw -B -ntp install -Dmaven.test.skip=true -Djacoco.skip=true -Dstyle.color=never
          ./mvnw -B -ntp -pl loomguard-core dependency:list -DoutputFile=/tmp/core-deps.txt -DincludeScope=compile -Dstyle.color=never
          if [ ! -s /tmp/core-deps.txt ]; then
            echo "::error::dependency:list 未产出依赖清单，门禁无法判定（请勿用 -q 静默失败）"
            exit 1
          fi
          if grep -E 'org\.springframework' /tmp/core-deps.txt; then
            echo "::error::core 模块出现 Spring 依赖，违反「core 零框架依赖」硬约束"
            exit 1
          fi
          echo "core 依赖树中无 org.springframework.*，边界完好"
